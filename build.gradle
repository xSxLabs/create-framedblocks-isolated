plugins {
    id 'java'
    id 'application'
}
group = 'dev.compat'
version = '0.1.0-SNAPSHOT'
repositories { mavenCentral() }
dependencies {
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-tree:9.9.1'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
application { mainClass = 'dev.compat.diagnostics.InspectCreate' }

tasks.register('runNbtTrace', JavaExec) {
    group = 'verification'
    description = 'Trace Create contraption NBT handling without modifying the JAR'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.compat.diagnostics.TraceNbtFlow'
}

tasks.register('patchFramedCamo', JavaExec) {
    group = 'verification'
    description = 'Create an EXPERIMENTAL patched JAR from a local, already-working Create JAR'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.compat.diagnostics.PatchFramedCamo'
}
